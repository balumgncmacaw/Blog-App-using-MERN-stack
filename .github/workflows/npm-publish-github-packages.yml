  build-image: 
    runs-on: ubuntu-latest
    #needs: build-test
    steps: 
      - name: checkout repo
        uses: actions/checkout@v4
      - name: set up Docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: login to Dockerhub 
        run: | 
          username=${{ secrets.DOCKERHUB_USERNAME }}
          password=${{ secrets.DOCKERHUB_TOKEN }}
          echo "$password" | docker login -u "$username" --password-stdin


      
      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with: 
          context: . 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blogapp:latest
  
  scan-image: 
    runs-on: ubuntu-latest
    needs: build-image
    steps: 
      - name: Scan Docker image for vulnerablities
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/blogapp:latest
          format: table
          exit-code: 0
          ignore-unfixed: true
  
  deploy-dev: 
    runs-on: ubuntu-latest
    needs: scan-image
    steps: 
      - name: Deploy to dev environment
        env: 
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: | 
          echo "Deploying to DEV..."
          ssh -o StrictHostKeyChecking=no -i $SSH_PRIVATE_KEY $DEV_USER@$DEV_HOST '
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/blogapp:latest &&
            docker stop blogapp || true &&
            docker rm blogapp || true &&
            docker run -d -p 80:3000 --name blogapp ${{ secrets.DOCKERHUB_USERNAME }}/blogapp:latest
        
  regression-dev:
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - name: Run regression tests on DEV
        run: |
          echo "Running regression tests on DEV environment..." 
